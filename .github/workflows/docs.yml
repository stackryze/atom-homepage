name: Build and Deploy Docs

on:
  push:
    branches: [docs]
    paths:
      - 'docs/**'
  pull_request:
    branches: [docs]
    paths:
      - 'docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Retype
        uses: retypeapp/action-build@latest
        with:
          config_path: docs/retype.yml
          output: .retype-output

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/docs' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .retype-output

  deploy:
    needs: build
    if: github.ref == 'refs/heads/docs' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
