# docker-compose.yml
services:
  atom:
    image: sudheerbhuvana25/atom-homepage:latest
    container_name: atom
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - atom_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      # COOKIE_SECURE: "true"  # Uncomment if behind HTTPS reverse proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  atom_data:
    driver: local